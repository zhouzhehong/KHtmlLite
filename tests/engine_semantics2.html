<!doctype html>
<html><head><meta charset="utf-8"><title>flex-batch2</title>
<style>
  /* flex order: document order is red(o1), olive(o2), navy(o3);
     order 3 / 1 / 2 => visual left->right: olive, navy, red. */
  #orderbox { display: flex; }
  #orderbox div { width: 60px; height: 30px; }
  #o1 { order: 3; background-color: #ff0000; }
  #o2 { order: 1; background-color: #808000; }
  #o3 { order: 2; background-color: #000080; }

  /* align-self overrides align-items for one item only. */
  #selfbox { display: flex; align-items: flex-start; height: 80px; }
  #selfbox div { width: 40px; height: 20px; }
  #s1 { background-color: #008080; }                     /* top */
  #s2 { align-self: flex-end; background-color: #800000; } /* bottom */

  /* flex-basis: 200px inside a 300px row. */
  #basisbox { display: flex; width: 300px; }
  #basisbox div { flex-basis: 200px; height: 24px; background-color: #00aa00; }

  /* flex shorthand + flex-shrink: two 150px items in a 200px row have to
     shrink (flex: 0 1 150px => grow 0, shrink 1, basis 150px). */
  #shrinkbox { display: flex; width: 200px; }
  #shrinkbox div { flex: 0 1 150px; height: 20px; background-color: #3366ff; }

  /* aspect-ratio: width 300px + ratio 3/2 => height 200px. */
  #ratio { width: 300px; aspect-ratio: 3 / 2; background-color: #cc8800; }
</style></head>
<body>
  <div id="orderbox"><div id="o1"></div><div id="o2"></div><div id="o3"></div></div>
  <div id="selfbox"><div id="s1"></div><div id="s2"></div></div>
  <div id="basisbox"><div></div></div>
  <div id="shrinkbox"><div></div><div></div></div>
  <div id="ratio"></div>
</body></html>
