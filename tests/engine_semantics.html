<!doctype html>
<html><head><meta charset="utf-8"><title>engine-semantics</title>
<style>
  /* @supports true: must apply (green text). */
  @supports (display: flex) { #sup_true { color: #00ff00; } }
  /* @supports true since the grid batch: must apply (red text). */
  @supports (display: grid) { #sup_grid { color: #ff0000; } }
  /* @supports false: selector(:has(*)) is unsupported -> block dropped. */
  @supports selector(:has(*)) { #sup_sticky { background-color: #00ff88; width: 40px; height: 20px; } }
  /* -webkit- prefixed property must reach the engine (border-radius). */
  #prefixed { -webkit-border-radius: 12px; background-color: #0000ff;
              width: 200px; height: 40px; color: #ffffff; }
  /* Old flex spelling via -webkit- display value must engage flex layout. */
  #flexbox { display: -webkit-flex; }
  #flexbox div { width: 40px; height: 40px; background-color: #ff00ff; }
  /* flex-wrap: 5 x 100px cards in a 300px row must wrap into 3 + 2 rows. */
  #wrap { display: flex; flex-wrap: wrap; width: 300px; }
  #wrap div { width: 100px; height: 40px; background-color: #00ffff; }
  /* logical property (LTR): margin-inline-start maps to margin-left. */
  #logical { margin-inline-start: 120px; width: 60px; height: 30px;
             background-color: #ff8000; }
  /* CSS custom properties: defined on :root, consumed via var() (and a
     fallback form for an undefined variable). */
  :root { --brand-bg: #009999; }
  #vars1 { background-color: var(--brand-bg); width: 80px; height: 24px; }
  #vars2 { background-color: var(--missing-bg, #cccc00); width: 80px; height: 24px; }
  /* HTML5 semantic element: UA sheet must make it block (full-width bg). */
  section { background-color: #ffff00; }
</style></head>
<body>
  <div id="sup_true">SUP_TRUE</div>
  <div id="sup_grid">SUP_GRID</div>
  <div id="sup_sticky">SUP_STICKY</div>
  <div id="prefixed">PREFIXED</div>
  <div id="flexbox"><div></div><div></div><div></div></div>
  <div id="wrap"><div></div><div></div><div></div><div></div><div></div></div>
  <div id="logical"></div>
  <div id="vars1"></div>
  <div id="vars2"></div>
  <section id="sem">X</section>
</body></html>
