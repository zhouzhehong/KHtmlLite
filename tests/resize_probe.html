<style>
  /* KHTML-compatible full-viewport saturation: NO flex, NO linear-gradient,
     NO hsl(), NO JS, NO borders, NO text — plain fixed table with solid hex
     cell colors.  Every page pixel is strongly saturated so an exposed-
     region sample cleanly separates real content from white flash /
     checkerboard.  (The original probe page could never pass its own
     thresholds: rgba borders landed ~22% of pixels in the "other" bucket,
     capping measured content at ~78% < the 90% gate.)  Cell colors are
     position-distinct so a botched relayout visibly shifts the sampled
     color signature. */
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background-color: #10685c; }
  table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
  td { border: 0; padding: 0; }
